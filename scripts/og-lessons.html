<!--
  Source of src/assets/og/lessons.png, the 1200x630 link-preview card for
  /lessons. Regenerate after changing it (from the repo root, macOS):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 \
      --virtual-time-budget=3000 --window-size=1200,630 \
      --screenshot=src/assets/og/lessons.png "file://$PWD/scripts/og-lessons.html"

  Keep the PNG under ~300 KB: WhatsApp skips larger preview images.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(../src/assets/fonts/montserrat/montserrat-semibold-webfont.woff2);font-weight:600}
@font-face{font-family:M;src:url(../src/assets/fonts/montserrat/montserrat-medium-webfont.woff2);font-weight:500}
@font-face{font-family:J;src:url(../src/assets/fonts/jetbrains-mono/JetBrainsMono-Regular.woff2)}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(172deg,#f6fafb 0%,#e8f0f3 52%,#d8e5ea 100%);font-family:M;color:#0d1a21;position:relative}
.code{position:absolute;right:64px;top:150px;font-family:J;font-size:21px;line-height:2.15;color:rgba(13,26,33,.55);white-space:pre;padding:28px 34px;border:1px solid rgba(13,26,33,.14);border-radius:14px;background:rgba(255,255,255,.6)}
.code b{font-weight:400;color:#0e7f86}
.in{position:absolute;left:80px;top:72px;width:620px}
.brand{font-weight:500;font-size:20px;letter-spacing:.28em;text-transform:uppercase;color:rgba(13,26,33,.5)}
.eye{font-family:J;font-size:22px;color:#0e7f86;margin-top:70px}
h1{margin:18px 0 0;font-weight:600;font-size:76px;line-height:1.03;letter-spacing:-.03em}
h1 span{display:block;color:rgba(13,26,33,.5)}
.cta{position:absolute;left:80px;bottom:72px;display:flex;gap:22px;align-items:center}
.pill{background:#0d1a21;color:#f6fafb;font-weight:600;font-size:24px;padding:16px 30px;border-radius:999px}
.url{font-family:J;font-size:21px;color:rgba(13,26,33,.6)}
</style></head><body>
<div class="in"><div class="brand">Martín Campagnoli</div><div class="eye">Coding lessons · 1:1 · online</div>
<h1>Learn to code<span>with a senior developer</span></h1></div>
<div class="code">const <b>lesson</b> = {
  format:   '1:1 on Google Meet',
  length:   '60 min',
  first:    'free intro call',
};</div>
<div class="cta"><div class="pill">Book a free intro call</div><div class="url">martincampagnoli.com/lessons</div></div>
</body></html>
